[advisories]
yanked = "deny"

[licenses]
# Resolved from the current tree with `cargo deny check licenses`. Add a line
# only after checking what the crate actually requires.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
]

[bans]
# hashbrown resolves to both 0.16 and 0.17 through ratatui-core. Warn rather
# than deny: the duplication is upstream and not ours to fix.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
