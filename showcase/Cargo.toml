[package]
name = "showcase"
description = "Interactive gallery of every tuile component"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "showcase"
path = "src/main.rs"

[dependencies]
# The gallery is a pure tuile consumer: every ratatui and crossterm type it needs comes
# through `tuile::prelude`, which is the surface an app is meant to use.
tuile = { path = "../tuile", version = "0.3.0" }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
