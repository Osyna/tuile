[package]
name = "tuile"
description = "Textual-grade widgets, design system, animation and app runtime on top of ratatui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
homepage = "https://osyna.github.io/tuile/"
documentation = "https://docs.rs/tuile"
keywords = ["tui", "ratatui", "widgets", "terminal", "ui"]
categories = ["command-line-interface", "gui"]
rust-version = "1.88"

[dependencies]
ratatui-core = { workspace = true }
ratatui-crossterm = { workspace = true }
crossterm = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
